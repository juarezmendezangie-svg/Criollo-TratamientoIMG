# ============================================
# Configuración del Sistema OMR
# ============================================

# --- Base de datos H2 (embebida, sin instalación) ---
db.url=jdbc:h2:./data/omr_examenes;AUTO_SERVER=TRUE
db.user=sa
db.password=

# --- Parámetros de detección de hoja ---
detector.hoja.canny.threshold1=75
detector.hoja.canny.threshold2=200
detector.hoja.aprox.epsilon=0.02

# --- Parámetros de detección de burbujas ---
# Valores optimizados: area.min=150 filtra ruido <4px².
# area.max=5000 captura todas las burbujas reales.
detector.burbujas.circularidad.min=0.4
detector.burbujas.area.min=20
detector.burbujas.area.max=50000
detector.burbujas.relleno.min=0.10

# --- Parámetros de procesamiento de imagen ---
filtros.kernel.apertura=3
filtros.kernel.cierre=3
filtros.umbral.otsu=true

# --- Configuración del examen ---
examen.max.preguntas=100
examen.opciones.por.pregunta=5

# --- Calificación ---
calificacion.nota.maxima=20
calificacion.nota.aprobacion=11
